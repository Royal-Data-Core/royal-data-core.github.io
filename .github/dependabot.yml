version: 2
updates:
  # Monitorar APENAS GitHub Actions (único ecossistema que realmente existe agora)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"
    # Commit messages padronizadas
    commit-message:
      prefix: "ci"
      include: "scope"
