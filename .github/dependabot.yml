# RFC-001 §2.6(2) — supply-chain: dependabot para npm E github-actions
# ADR-010 D15: a fonte precisa gerar apenas estados peer-válidos — um PR
# inválido é recusado pelo guard (npm ci ERESOLVE) e vira ruído semanal
# permanente. Política estrutural: majors npm held (dois datapoints no
# mesmo ciclo 2026-10-20 — typescript 7 vs peer ^5||^6 do @astrojs/check
# 0.9.11; eslint 10 vs peer ^3..^9 do eslint-plugin-jsx-a11y@6.10.2 —
# obrigam locks legacy-peer-deps). Majors entram por upgrade path manual
# (ADR + bateria completa) quando o ecossistema ratificar os peers;
# minors/patches continuam voando no ciclo semanal.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels: ["dependencies", "npm"]
    # D-01: adicionar `reviewers: [handle-real]` quando o handle existir —
    # placeholder strings tornam a config inválida.
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      testing:
        patterns:
          ["@playwright/*", "playwright", "vitest", "@vitest/*", "@axe-core/*"]
      lint:
        patterns:
          ["eslint*", "prettier*", "@typescript-eslint/*", "markdownlint*"]
    ignore:
      # ADR-010 D15 — majors npm held: cada major chega antes de o
      # ecossistema de plugins ratificar o peer correspondente (evidências
      # 2026-10-20 no comentário do topo). Reversão por caso: quando o
      # plugin relevante ratificar o peer da major, aplicar manualmente
      # via ADR próprio + bateria completa. Minors/patches NÃO são
      # afetados — CVE patches seguem no ciclo semanal.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels: ["dependencies", "ci", "INFRA-001"]
    # BYPASS-001: após conversão para SHA, dependabot mantém os pins atualizados
