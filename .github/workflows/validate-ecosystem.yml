name: Validate SDD Ecosystem

on:
  push:
    paths:
      - ".opencode/agents/**"
      - ".ai/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".opencode/agents/**"
      - ".ai/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run parser tests
        run: python scripts/test_nexus_parser.py

      - name: Validate CONSTITUTION.md exists (SSOT normativa)
        run: |
          if [ ! -f .ai/CONSTITUTION.md ]; then
            echo "❌ .ai/CONSTITUTION.md não encontrado"
            exit 1
          fi
          echo "✅ CONSTITUTION.md presente"

      - name: Check agent files
        run: |
          REQUIRED_AGENTS=(
            "nexus-prime"
            "architect-sdd"
            "spec-engineer"
            "frontend-astro"
            "content-strategist"
            "devops-platform"
            "integrations-security"
            "qa-shiftleft"
            "reviewer-gatekeeper"
          )
          for agent in "${REQUIRED_AGENTS[@]}"; do
            if [ ! -f ".opencode/agents/${agent}.md" ]; then
              echo "❌ Agente faltando: ${agent}.md"
              exit 1
            fi
          done
          echo "✅ Todos os agentes presentes"
