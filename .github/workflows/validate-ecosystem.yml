# Validate Ecosystem Scripts — internals gating (ADR-008 D7)
# The SDD corpus (.ai/) and the agent control plane (.opencode/) are INTERNAL
# and no longer published (see .gitignore + README). This workflow validates the
# on-repo surface that still ships: the Python validators/dispatcher scripts.
name: Validate SDD Ecosystem

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/validate-ecosystem.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/validate-ecosystem.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run parser tests (nexus delegation contract)
        run: python scripts/test_nexus_parser.py

      - name: Run analyst-integration tests (contractwire)
        run: python scripts/test_project_analyst_integration.py
