# RFC-001 §2.2 — Revalida TUDO sobre main (não confia no verde de develop) e deploya.
# BYPASS-001/INFRA-001: fechado neste ciclo — todas as actions pinadas por SHA completo via scripts/pin-actions.sh (npm run pin:actions)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # NUNCA cancelar deploy em andamento

env:
  NODE_VERSION: "24"

jobs:
  guard:
    name: guard · pre-deploy revalidation
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      - name: C1 · assert static output
        run: |
          grep -Eq "output:\s*['\"]?(server|hybrid)" astro.config.mjs && \
            { echo "::error::CONSTITUTION §C1 violado"; exit 1; } || echo "static ✓"
      - name: Install (frozen, no lifecycle scripts)
        run: npm ci --ignore-scripts # ADR-001 D3/D4 — NUNCA `npm install`

      - name: Static battery (RFC-001 §2.2 — revalida TUDO sobre main)
        run: |
          npx astro sync
          npm run check
          npm run lint
          npm run format:check
          npm run lint:md
          npm run lint:topology
      - name: gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/g.tar.gz
          tar -xzf /tmp/g.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

  build:
    name: build · production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      - run: npm ci --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # BYPASS-001
        with:
          path: .astro/
          key: astro-prod-${{ hashFiles('src/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-prod-

      # RFC-001 §2.2 — mesma resolução determinística do ci.yml (ADR-008 D7:
      # configure-pages@v5/v6 crasham no runner 2.337.0; zero rede, zero token).
      - name: Resolve site + base (no-action, deterministic)
        id: pages
        run: |
          set -euo pipefail
          OWNER_NORM=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "origin=https://${OWNER_NORM}.github.io" >> "$GITHUB_OUTPUT"
          echo "base_path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          NODE_ENV: production
        run: npm run build

      - name: Bundle + external audit (SPEC-008)
        run: node scripts/audit-bundle.mjs --dist dist

      - name: Artifact sanity (RFC-001 FM-04/FM-06)
        run: |
          for f in dist/index.html dist/404.html dist/.nojekyll dist/robots.txt dist/rss.xml; do
            test -f "$f" || { echo "::error::artefato ausente: $f"; exit 1; }
          done
          SIZE_MB=$(du -sm dist | cut -f1)
          [ "$SIZE_MB" -le 100 ] || { echo "::error::§C5 dist ${SIZE_MB}MB > 100MB"; exit 1; }
          echo "dist: ${SIZE_MB} MB ✓"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5 # BYPASS-001
        with:
          path: dist/
          retention-days: 7

      # Cópia adicional para os gates de teste (deploy-pages consome o tar; tests precisam do dir)
      - name: Upload dist for test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 # BYPASS-001
        with:
          {
            name: dist,
            path: dist/,
            retention-days: 2,
            if-no-files-found: error,
          }

  verify:
    name: verify · production gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      # RFC-001 §2.6(4) / ADR-008 D7 — deployment context via GITHUB_ENV
      # (shell-side resolution, zero event interpolation in run:).
      - name: Deployment context (SITE_URL + SITE_BASE)
        run: |
          OWNER_NORM=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "SITE_URL=https://${OWNER_NORM}.github.io" >> "$GITHUB_ENV"
          echo "SITE_BASE=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # BYPASS-001
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 # BYPASS-001
        with: { name: dist, path: dist/ }
      - run: npm run test:unit -- --coverage
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:links
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 # BYPASS-001
        with:
          name: prod-test-reports
          path: |
            playwright-report/
            test-results/
            coverage/
          retention-days: 30
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse · production budgets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 # BYPASS-001
        with: { name: dist, path: dist/ }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # BYPASS-001
        with:
          path: .lighthouseci/
          key: lhci-main
          restore-keys: lhci-
      # ADR-008 D7 — base-mounted views: production artifact is root-layout with
      # base-prefixed routes; LHCI's built-in file server maps URL=path, so we
      # audit a MIRRORED view (dist/* under site-io/) that matches the real
      # Pages layout. 404 page is excluded from budgets (intentionally
      # non-indexable, no canonical — SPEC-006 AC-006.3).
      - name: Mirror artifact under site-io/ (base-mounted LHCI view)
        run: |
          mkdir -p .lhciview/site-io
          cp -r dist/* .lhciview/site-io/
          rm -f .lhciview/404.html .lhciview/site-io/404.html
      - name: LHCI (retry 1 — RFC-001 FM-08)
        run: |
          npx @lhci/cli@0.15.x autorun --config=lighthouserc.prod.json \
            || npx @lhci/cli@0.14.x autorun --config=lighthouserc.prod.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 # BYPASS-001
        with:
          {
            name: prod-lighthouse,
            path: .lighthouseci/,
            retention-days: 90,
            if-no-files-found: ignore,
          }

  deploy:
    name: deploy · GitHub Pages (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 6 # §C5: hard limit plataforma é 10 min
    needs: [build, verify, lighthouse]
    permissions:
      contents: read
      pages: write
      id-token: write # OIDC — RFC-001 §2.3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5 # BYPASS-001

      # RFC-001 FM-15: smoke test pós-deploy (retry/backoff para HTTP 429 — FM-10)
      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGE_URL%/}/"
          echo "smoke testing: $URL"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then echo "✓ HTTP 200 no attempt $attempt"; break; fi
            if [ "$CODE" = "429" ]; then echo "::warning::HTTP 429 (rate limit) — aguardando"; fi
            [ "$attempt" = "5" ] && { echo "::error::site não respondeu 200 após 5 tentativas (último: $CODE)"; exit 1; }
            sleep $((attempt * 30))
          done
          # SPEC-006: 404 custom servida
          CODE404=$(curl -s -o /dev/null -w '%{http_code}' -L "${URL}rota-inexistente-xyz" || echo "000")
          echo "404 route status: $CODE404"
          # SPEC-008 AC-008.10: HSTS fornecido pela edge do GitHub
          curl -sI -L "$URL" | grep -i 'strict-transport-security' \
            && echo "✓ HSTS presente" \
            || echo "::warning::HSTS ausente — verifique Settings → Pages → Enforce HTTPS"
          # ADR-002: confirmar que NÃO há header CSP (esperado) e que há no HTML
          curl -s -L "$URL" | grep -q 'http-equiv="Content-Security-Policy"' \
            && echo "✓ CSP via meta presente (ADR-002 D1)" \
            || { echo "::error::CSP-meta ausente no HTML publicado"; exit 1; }

      # §C6 — Journal: lembra o humano de registrar a entrada (não commita automaticamente,
      # pois commits via GITHUB_TOKEN não disparam rebuild do Pages)
      - name: Journal reminder (§C6)
        run: |
          echo "::notice title=JOURNAL OBRIGATÓRIO::Registre em README.md: [$(date -u +%F)] · ${GITHUB_SHA::7} · $(git log -1 --pretty=%s) · PR #${{ github.run_number }}"
