# RFC-001 §2.2 (as amended by ADR-010) — Revalidates EVERYTHING on main (does
# not trust develop green) by calling the canonical battery in ci.yml
# (workflow_call — same commit, no cross-run trust), then packs the validated
# artifact for GitHub Pages (OIDC), deploys and smoke-tests the live origin.
# BYPASS-001/INFRA-001: all Actions SHA-pinned; the local `./.github/workflows`
# reuse is same-commit by definition (no @ref is allowed on that syntax).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # NEVER cancel an in-flight deploy

env:
  NODE_VERSION: "24"

jobs:
  battery:
    name: battery · full revalidation on main (guard→build→verify∥lighthouse)
    # Canonical battery: guard (static+secrets+pin) → build (node 22/24/26,
    # pagefind+bundle audit) → verify (unit|e2e|a11y|links) ∥ lighthouse.
    # Artifact `dist` is uploaded INSIDE this run by the build job, so the
    # deploy job below deploys EXACTLY the validated artifact (no rebuild).
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: deploy · GitHub Pages (OIDC) + post-publish smoke
    runs-on: ubuntu-latest
    timeout-minutes: 6 # §C5: platform hard limit is 10 min
    needs: [battery]
    permissions:
      contents: read
      pages: write
      id-token: write # OIDC — RFC-001 §2.3
    steps:
      - name: Checkout (artifact audits run against released sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001
        with:
          fetch-depth: 1

      # Deploy the ARTIFACT validated by this same run's battery — not a
      # rebuild — so the byte content matches the audited SHA 1:1 (ADR-010).
      - name: Download validated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 # BYPASS-001
        with:
          name: dist
          path: dist/

      - name: Final artifact sanity (RFC-001 FM-04/FM-06)
        run: |
          for f in dist/index.html dist/404.html dist/.nojekyll dist/robots.txt dist/rss.xml dist/_pagefind/pagefind.js; do
            test -f "$f" || { echo "::error::artifact missing: $f"; exit 1; }
          done
          SIZE_MB=$(du -sm dist | cut -f1)
          [ "$SIZE_MB" -le 100 ] || { echo "::error::§C5 dist ${SIZE_MB}MB > 100MB"; exit 1; }
          echo "dist: ${SIZE_MB} MB ✓"

      - name: Pack + upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5 # BYPASS-001
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5 # BYPASS-001

      # RFC-001 FM-15: post-deploy smoke test (retry/backoff for HTTP 429 — FM-10).
      # CDN-staleness: Pages cache (max-age=600) may serve the OLD object in the
      # first seconds after swap — smoke queries with buster `?v=<sha>` (static
      # server ignores query; Fastly uses a distinct key → origin fresh).
      # Backoff is BOUNDED (ADR-010): sleeps 10/20/30/40 s worst-case ≈ 100 s so
      # the whole deploy job stays inside its §C5 6-minute ceiling.
      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGE_URL%/}/"
          BUSTER="v=${GITHUB_SHA}"
          echo "smoke testing: $URL ($BUSTER)"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -L "$URL?$BUSTER" || echo "000")
            if [ "$CODE" = "200" ]; then echo "✓ HTTP 200 on attempt $attempt"; break; fi
            if [ "$CODE" = "429" ]; then echo "::warning::HTTP 429 (rate limit) — backing off"; fi
            [ "$attempt" = "5" ] && { echo "::error::site did not answer 200 after 5 attempts (last: $CODE)"; exit 1; }
            sleep $((attempt * 10))
          done
          # SPEC-006: custom 404 served
          CODE404=$(curl -s -o /dev/null -w '%{http_code}' -L "${URL}rota-inexistente-xyz?$BUSTER" || echo "000")
          echo "404 route status: $CODE404"
          # SPEC-008 AC-008.10: HSTS provided by the GitHub edge
          curl -sI -L "$URL?$BUSTER" | grep -i 'strict-transport-security' \
            && echo "✓ HSTS present" \
            || echo "::warning::HSTS missing — check Settings → Pages → Enforce HTTPS"
          # ADR-002: confirm the HTML carries the CSP meta. Post-swap CDN
          # instability (up-to-minutes of 404/502 on some nodes before origin
          # propagation completes) produces EMPTY/error bodies that grep
          # cannot match — so: curl -sf guards transport, --max-time caps
          # each attempt, fixed 10 s cadence, error ONLY when a real HTML 200
          # is served without the meta (a true regression). Bounded: 6 × 10 s
          # + fetches, well inside the §C5 6-minute deploy ceiling (ADR-010 D14).
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -sf -L --max-time 20 "$URL?$BUSTER" || true)
            if [ -n "$BODY" ] && printf '%s\n' "$BODY" | grep -q 'http-equiv="Content-Security-Policy"'; then
              echo "✓ CSP via meta present (ADR-002 D1) — attempt $attempt"; break
            fi
            [ "$attempt" = "6" ] && { echo "::error::CSP-meta missing from published HTML"; exit 1; }
            echo "::warning::CSP not yet visible (attempt $attempt) — post-deploy propagation"
            sleep 10
          done

      # §C6 — Journal: reminds the human to register the entry (does not commit
      # automatically: GITHUB_TOKEN commits do not trigger Pages rebuilds)
      - name: Journal reminder (§C6)
        run: |
          echo "::notice title=REQUIRED JOURNAL::Record in README.md: [$(date -u +%F)] · ${GITHUB_SHA::7} · $(git log -1 --pretty=%s) · PR #${{ github.run_number }}"
