# RFC-001 §2.2 — Revalida TUDO sobre main (não confia no verde de develop) e deploya.
# BYPASS-001: actions pinadas por tag; conversão para SHA até Dia 10 (INFRA-001)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # NUNCA cancelar deploy em andamento

env:
  NODE_VERSION: "24"

jobs:
  guard:
    name: guard · pre-deploy revalidation
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6 # BYPASS-001
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      - run: echo 'Skipping npm steps due to missing package.json'
      - run: echo 'Placeholder deployment steps (replace with actual deployment commands)'
      - name: C1 · assert static output
        run: |
          grep -Eq "output:\s*['\"]?(server|hybrid)" astro.config.mjs && \
            { echo "::error::CONSTITUTION §C1 violado"; exit 1; } || echo "static ✓"
      - name: gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" -o /tmp/g.tar.gz
          tar -xzf /tmp/g.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

  build:
    name: build · production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: guard
    steps:
      - uses: actions/checkout@v6 # BYPASS-001
      - uses: actions/setup-node@v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4 # BYPASS-001
        with:
          path: .astro/
          key: astro-prod-${{ hashFiles('src/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-prod-

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5 # BYPASS-001
        with:
          static_site_generator: astro

      - name: Build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          NODE_ENV: production
        run: npm run build

      - name: Bundle + external audit (SPEC-008)
        run: node scripts/audit-bundle.mjs --dist dist

      - name: Artifact sanity (RFC-001 FM-04/FM-06)
        run: |
          for f in dist/index.html dist/404.html dist/.nojekyll dist/robots.txt dist/rss.xml; do
            test -f "$f" || { echo "::error::artefato ausente: $f"; exit 1; }
          done
          SIZE_MB=$(du -sm dist | cut -f1)
          [ "$SIZE_MB" -le 100 ] || { echo "::error::§C5 dist ${SIZE_MB}MB > 100MB"; exit 1; }
          echo "dist: ${SIZE_MB} MB ✓"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4 # BYPASS-001
        with:
          path: dist/
          retention-days: 7

      # Cópia adicional para os gates de teste (deploy-pages consome o tar; tests precisam do dir)
      - name: Upload dist for test jobs
        uses: actions/upload-artifact@v4 # BYPASS-001
        with:
          {
            name: dist,
            path: dist/,
            retention-days: 2,
            if-no-files-found: error,
          }

  verify:
    name: verify · production gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build
    steps:
      - uses: actions/checkout@v6 # BYPASS-001
      - uses: actions/setup-node@v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4 # BYPASS-001
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: actions/download-artifact@v4 # BYPASS-001
        with: { name: dist, path: dist/ }
      - run: npm run test:unit -- --coverage
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:links
      - if: always()
        uses: actions/upload-artifact@v4 # BYPASS-001
        with:
          name: prod-test-reports
          path: |
            playwright-report/
            test-results/
            coverage/
          retention-days: 30
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse · production budgets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build
    steps:
      - uses: actions/checkout@v6 # BYPASS-001
      - uses: actions/setup-node@v7 # BYPASS-001
        with: { node-version: "24", cache: "npm" }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4 # BYPASS-001
        with: { name: dist, path: dist/ }
      - uses: actions/cache@v4 # BYPASS-001
        with:
          path: .lighthouseci/
          key: lhci-main
          restore-keys: lhci-
      - name: LHCI (retry 1 — RFC-001 FM-08)
        run: |
          npx @lhci/cli@0.15.x autorun --config=lighthouserc.json \
            || npx @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@v4 # BYPASS-001
        with:
          {
            name: prod-lighthouse,
            path: .lighthouseci/,
            retention-days: 90,
            if-no-files-found: ignore,
          }

  deploy:
    name: deploy · GitHub Pages (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 6 # §C5: hard limit plataforma é 10 min
    needs: [build, verify, lighthouse]
    permissions:
      contents: read
      pages: write
      id-token: write # OIDC — RFC-001 §2.3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # BYPASS-001

      # RFC-001 FM-15: smoke test pós-deploy (retry/backoff para HTTP 429 — FM-10)
      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGE_URL%/}/"
          echo "smoke testing: $URL"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then echo "✓ HTTP 200 no attempt $attempt"; break; fi
            if [ "$CODE" = "429" ]; then echo "::warning::HTTP 429 (rate limit) — aguardando"; fi
            [ "$attempt" = "5" ] && { echo "::error::site não respondeu 200 após 5 tentativas (último: $CODE)"; exit 1; }
            sleep $((attempt * 30))
          done
          # SPEC-006: 404 custom servida
          CODE404=$(curl -s -o /dev/null -w '%{http_code}' -L "${URL}rota-inexistente-xyz" || echo "000")
          echo "404 route status: $CODE404"
          # SPEC-008 AC-008.10: HSTS fornecido pela edge do GitHub
          curl -sI -L "$URL" | grep -i 'strict-transport-security' \
            && echo "✓ HSTS presente" \
            || echo "::warning::HSTS ausente — verifique Settings → Pages → Enforce HTTPS"
          # ADR-002: confirmar que NÃO há header CSP (esperado) e que há no HTML
          curl -s -L "$URL" | grep -q 'http-equiv="Content-Security-Policy"' \
            && echo "✓ CSP via meta presente (ADR-002 D1)" \
            || { echo "::error::CSP-meta ausente no HTML publicado"; exit 1; }

      # §C6 — Journal: lembra o humano de registrar a entrada (não commita automaticamente,
      # pois commits via GITHUB_TOKEN não disparam rebuild do Pages)
      - name: Journal reminder (§C6)
        run: |
          echo "::notice title=JOURNAL OBRIGATÓRIO::Registre em README.md: [$(date -u +%F)] · ${GITHUB_SHA::7} · $(git log -1 --pretty=%s) · PR #${{ github.run_number }}"
