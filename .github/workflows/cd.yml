name: CD

# ⛔ DESATIVADO para push — ADR-008 D7: stub de deploy vazio ("Add deployment
# commands here") disparava VERDE-FALSO em todo push main e confligia com o
# pipeline canônico deploy.yml (RFC-001 §2.2). Disparo manual apenas, para
# auditoria/manutenção histórica do manifest do ecossistema.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Deploy
        run: |
          echo 'Deploying to production...'
          # Add deployment commands here
