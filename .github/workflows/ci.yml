# RFC-001 §2.2 — Canonical validation battery (PR, develop, deploy-caller)
# BYPASS-001/INFRA-001: all Actions pinned by full SHA (scripts/pin-actions.sh --check
# is a blocking guard gate). Local `./.github/workflows` reuse carries no @ref by
# design: the called workflow is same-commit as the caller (GitHub native pin).
# ADR-008 D7: SDD corpus (.ai/) is internal/local-only — §C3 (adr-gate) is an
# upstream authoring duty; CI validates executable gates, not the corpus.
# ADR-010: this file is the SINGLE topology definition. ci.yml runs it directly
# on PR/develop and deploy.yml re-runs it on main via workflow_call (RFC-001
# §2.2 "revalidate everything on main" kept: the caller spends one extra artifact
# transfer, not one duplicated pipeline).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call: {}

# RFC-001 §2.6(5): pull_request_target BANNED. No secret reaches PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24" # ADR-005 D3 — Active LTS

jobs:
  # ────────────────────────────────────────────────────────────────
  # GATE 1 — No browser. Fast. Fails before any build spend.
  # ────────────────────────────────────────────────────────────────
  guard:
    name: guard · lint + static analysis + secrets
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001
        with:
          fetch-depth: 0 # required by gitleaks (full history)

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install (frozen, no lifecycle scripts)
        run: npm ci --ignore-scripts # ADR-001 D3/D4 — NEVER `npm install`

      # ADR-001 D4: invariant that makes --ignore-scripts safe
      - name: ADR-001/D4 · verify no dependency declares lifecycle scripts
        run: node scripts/verify-no-postinstall.mjs

      - name: Astro sync (generates types for `astro check`)
        run: npx astro sync

      - name: Typecheck (astro check + tsc)
        run: npm run check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier --check)
        run: npm run format:check

      - name: Markdown lint (content)
        run: npm run lint:md

      # CONSTITUTION §C9 — marketing-vocabulary gate (wired as blocking gate;
      # ADR-010: previously shipped as script-only with zero CI consumers)
      - name: C9 · lint copy (verifiable-claims vocabulary gate)
        run: npm run lint:copy

      # CONSTITUTION §C1 — static output mode
      - name: C1 · assert output mode is static
        run: |
          if grep -Eq "output:\s*['\"]?(server|hybrid)" astro.config.mjs; then
            echo "::error file=astro.config.mjs::CONSTITUTION §C1 — only output: 'static' is allowed"
            exit 1
          fi
          echo "output mode: static ✓"

      # ADR-000 — identifiers in EN
      - name: ADR-000 · no accented identifiers
        run: |
          if grep -REn '\b(function|const|let|var|class|interface|type)\s+[A-Za-z_$]*[àáâãéêíóôõúüçÀÁÂÃÉÊÍÓÔÕÚÜÇ]' src/ scripts/ 2>/dev/null; then
            echo "::error::ADR-000 — identifiers must be EN, no accents"
            exit 1
          fi

      # ADR-004 / SPEC-001 AC-001.9 — withBase() enforcement
      - name: ADR-004 · lint topology (withBase enforcement)
        run: npm run lint:topology

      - name: gitleaks (full history)
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

      # RFC-001 §2.7 / INFRA-001 (ADR-008 D3 F-1) — pin-check as blocking gate
      - name: INFRA-001 · all uses refs SHA-pinned (blocking)
        run: npm run pin:actions:check

  # ────────────────────────────────────────────────────────────────
  # GATE 2 — Build + artifact audits (Node LTS range)
  # ────────────────────────────────────────────────────────────────
  build:
    name: build · astro + pagefind + bundle audit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 8 # §C5 / RFC-001 FM-02
    needs: guard
    strategy:
      matrix:
        node: ["22.x", "24.x", "26.x"] # ADR-005 D2 — LTS + Current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Restore Astro cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # BYPASS-001
        with:
          path: .astro/
          key: astro-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('src/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-${{ runner.os }}-node${{ matrix.node }}-

      # RFC-001 §2.6(4): event variables ALWAYS via env, never interpolated into run:
      # ADR-008 D7: configure-pages@v5/v6 crash deterministically (non-Error throw,
      # pre-API) on runner 2.337.0 — origin/base resolved shell-side, zero network.
      - name: Resolve site + base (no-action, deterministic)
        id: pages
        run: |
          set -euo pipefail
          OWNER_NORM=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "origin=https://${OWNER_NORM}.github.io" >> "$GITHUB_OUTPUT"
          echo "base_path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Build (Astro)
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: SPEC-007/AC-007.N3 · verify Pagefind index exists
        run: |
          test -f dist/_pagefind/pagefind.js   || { echo "::error::SPEC-007: pagefind.js missing"; exit 1; }
          ls dist/_pagefind/wasm.*.pagefind >/dev/null 2>&1 || test -f dist/_pagefind/pagefind.wasm || { echo "::error::SPEC-007: Pagefind wasm missing (wasm.*.pagefind)"; exit 1; }
          du -sh dist/_pagefind
          [ "$(du -sm dist/_pagefind | cut -f1)" -le 5 ] || { echo "::error::SPEC-007: index > 5 MB"; exit 1; }

      - name: SPEC-008 · bundle + external-resource audit
        run: node scripts/audit-bundle.mjs --dist dist

      - name: CONSTITUTION §C5 · repo content gate (500 MB)
        run: |
          # §C5 counts the REPO, not the runner workspace: node_modules and
          # .git are platform artifacts (~680 MB) that would falsely trip the
          # threshold after the npm@10..12 lock alignment (ADR-010 D11).
          SIZE_MB=$(du -sm --exclude=node_modules --exclude=.git . | cut -f1)
          echo "repo content size: ${SIZE_MB} MB (node_modules/.git excluded by definition)"
          [ "$SIZE_MB" -le 500 ] || { echo "::error::§C5 — repo ${SIZE_MB} MB > 500 MB"; exit 1; }
          DIST_MB=$(du -sm dist | cut -f1)
          echo "dist size: ${DIST_MB} MB"
          [ "$DIST_MB" -le 100 ] || { echo "::error::§C5 — published site ${DIST_MB} MB > 100 MB"; exit 1; }

      - name: ADR-004 · .nojekyll present in artifact
        run: |
          test -f dist/.nojekyll || { echo "::error::dist/.nojekyll missing (copy into public/)"; exit 1; }
          test -f dist/404.html  || { echo "::error::SPEC-006: dist/404.html missing"; exit 1; }
          test -f dist/index.html || { echo "::error::dist/index.html missing (RFC-001 FM-04)"; exit 1; }

      - name: SEC · assert no .ai/ or debris enters dist
        run: |
          if find dist \( -path '*/.ai/*' -o -name '.ai' -o -name '*.pyc' \) -print -quit | grep -q .; then
            echo "::error::artifact contamination: .ai or debris leaked into dist"; exit 1
          fi
          echo "dist clean (no .ai/, no pyc) ✓"

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 # BYPASS-001
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # GATE 3 — Runtime suites in PARALLEL (ADR-010): unit / e2e / a11y / links.
  # Wall-clock drops from sequential serial to slowest-suite; runner minutes
  # are free on public repos (SDD-CONTEXT §5), so this is a pure latency win.
  # ────────────────────────────────────────────────────────────────
  verify:
    name: verify · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, e2e, a11y, links]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        if: matrix.suite == 'e2e' || matrix.suite == 'a11y'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # BYPASS-001
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (cold cache)
        if: (matrix.suite == 'e2e' || matrix.suite == 'a11y') && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (warm cache)
        if: (matrix.suite == 'e2e' || matrix.suite == 'a11y') && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download dist (artifact under test)
        if: matrix.suite != 'unit'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 # BYPASS-001
        with:
          name: dist
          path: dist/

      # RFC-001 §2.6(4) / ADR-008 D7 — deployment context via GITHUB_ENV
      # (shell-side resolution, zero event interpolation in run:).
      - name: Deployment context (SITE_URL + SITE_BASE — matches build ctx)
        if: matrix.suite != 'unit'
        run: |
          OWNER_NORM=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "SITE_URL=https://${OWNER_NORM}.github.io" >> "$GITHUB_ENV"
          echo "SITE_BASE=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Unit tests + coverage (§C12.3, ≥80% critical path)
        if: matrix.suite == 'unit'
        run: npm run test:unit -- --coverage

      - name: E2E (Playwright, Gherkin scenarios from SPECs)
        if: matrix.suite == 'e2e'
        run: npm run test:e2e

      - name: Accessibility (axe-core, WCAG 2.1 AA, 2 viewports)
        if: matrix.suite == 'a11y'
        run: npm run test:a11y

      - name: Link integrity (linkinator, hermetic)
        if: matrix.suite == 'links'
        run: npm run test:links

      - name: Upload suite reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 # BYPASS-001
        with:
          name: test-reports-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
            coverage/
            .linkinator/
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────
  # GATE 4 — Core Web Vitals (§C10 / SPEC-002, SPEC-004)
  # ────────────────────────────────────────────────────────────────
  lighthouse:
    name: lighthouse · core web vitals budgets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # BYPASS-001

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 # BYPASS-001
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 # BYPASS-001
        with:
          name: dist
          path: dist/

      - name: Restore LHCI baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # BYPASS-001
        with:
          path: .lighthouseci/
          key: lhci-${{ github.ref_name }}
          restore-keys: lhci-

      # RFC-001 FM-08: retry 1 tolerates throttling flakiness on shared runners
      - name: Lighthouse CI (mobile, hard budgets)
        run: |
          npx @lhci/cli@0.15.x autorun --config=lighthouserc.json \
            || npx @lhci/cli@0.15.x autorun --config=lighthouserc.json

      - name: Upload LHCI report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 # BYPASS-001
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
          if-no-files-found: ignore
